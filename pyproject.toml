[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-research-assistant"
version = "0.3.0"
description = "Answers questions about research papers with cited passages, using a retrieve-answer-review loop measured on QASPER."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bharath Mandha" }]
keywords = [
    "llm",
    "rag",
    "agents",
    "langgraph",
    "research",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=3.36,<4",
    "langgraph>=0.2",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "pypdf>=4.0",
    "arxiv>=2.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "numpy>=1.24",
    "tenacity>=8.2",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/bharathkumardev1/agentic-research-assistant"
Repository = "https://github.com/bharathkumardev1/agentic-research-assistant"
Issues = "https://github.com/bharathkumardev1/agentic-research-assistant/issues"

[project.scripts]
research-assistant = "research_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_assistant = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# The older modules use typing.Optional/List from when Python 3.9 was supported; newer
# code uses the builtin forms. Not worth churning every file to make them match.
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["arxiv", "onnxruntime"]
ignore_missing_imports = true
