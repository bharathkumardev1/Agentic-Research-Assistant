title = "Agentic-Research-Assistant"

[extend]
useDefault = true

# The recordings key every model reply and every search by a SHA-256 hash, in a field called
# "key": a hash of the request for calls.jsonl, and of [paper, query, k, embeddings] for the
# searches in runs.jsonl. Gitleaks' generic-api-key rule reads each 64-hex value as a secret.
#
# The exception is attached to generic-api-key itself, so it can't hide any other rule's
# findings, and it needs both conditions: the finding is in one of those two files, and the
# matched value is lowercase hex (10 to 64 characters, since `gitleaks dir` reads files in
# chunks and can cut a hash). Any other secret in those files is still reported.
# Checked on gitleaks 8.25 to 8.30.1 against the full history, and against keys planted in
# the recordings.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SHA-256 request hashes in the evaluation recordings"
condition = "AND"
paths = [
  '''^results/qasper/(calls|runs)\.jsonl$''',
]
regexes = [
  '''^[0-9a-f]{10,64}$''',
]
