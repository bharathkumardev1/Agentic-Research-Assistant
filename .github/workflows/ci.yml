name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type check with mypy
        run: mypy

      # The MiniLM test compares against recorded vectors, so CI needs the real weights.
      - uses: actions/cache@v6
        with:
          path: models/all-MiniLM-L6-v2
          key: minilm-l6-v2-6fd5d72f

      - name: MiniLM weights, checked against their SHA-256
        run: python -c "from research_assistant.rag.embeddings import download_minilm as d; d('models/all-MiniLM-L6-v2')"

      - name: Run tests
        run: pytest -q

