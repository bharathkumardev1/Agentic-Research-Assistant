name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,service]"
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy
      # The MiniLM test compares against recorded vectors, so CI needs the real weights.
      - uses: actions/cache@v6
        with:
          path: models/all-MiniLM-L6-v2
          key: minilm-l6-v2-6fd5d72f
      - name: MiniLM weights, checked against their SHA-256
        run: python -c "from research_assistant.rag.embeddings import download_minilm as d; d('models/all-MiniLM-L6-v2')"
      - name: Tests
        run: pytest -q

  image:
    # The image as it starts with no key and no mounts: sample papers, hashing embeddings,
    # offline stub. Checks the API answers with citations and the CLI runs inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t research-assistant .
      - name: Smoke test
        run: |
          docker run -d --name ra -p 8000:8000 research-assistant
          for i in $(seq 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/research -H 'Content-Type: application/json' \
            -d '{"question": "How much does SciRAG reduce unsupported claims?"}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['cited'] and r['trace']['calls'] >= 1, r"
          docker exec ra python -m research_assistant demo --max-rounds 1 | tail -3
          docker logs ra

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  recording:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: echo "present=$(test -f results/qasper/calls.jsonl && echo true || echo false)" >> "$GITHUB_OUTPUT"

  replay:
    # Reruns each committed QASPER results file from the recording, with no API key: every
    # search, model reply and score has to come out the same. Skipped until a recording exists.
    needs: recording
    if: needs.recording.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - uses: actions/cache@v6
        with:
          path: models/all-MiniLM-L6-v2
          key: minilm-l6-v2-6fd5d72f
      - name: MiniLM weights, checked against their SHA-256
        run: python -c "from research_assistant.rag.embeddings import download_minilm as d; d('models/all-MiniLM-L6-v2')"
      - name: QASPER from the release tarballs
        run: research-assistant qasper-download
      - name: Replay
        run: for f in results/qasper-*.json; do research-assistant check-replay "$f" || exit 1; done
